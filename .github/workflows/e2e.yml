name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm type-check
      # Ubuntu 24.04's AppArmor blocks Chrome's user-namespace sandbox ("No usable sandbox!").
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # A fresh runner's first Chrome launch takes up to ~18 s, enough to blow e2e's 20 s wait for the agent device.
      - run: time google-chrome --headless=new --no-first-run --dump-dom about:blank > /dev/null
      - run: pnpm e2e
        env:
          CHROME: /usr/bin/google-chrome
